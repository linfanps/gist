<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #111;
      }
      .lbl { font-size: 11px; color: #666; margin-bottom: 5px; }
      .orig {
        font-size: 12px; color: #666; margin-bottom: 12px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      input[type="text"] {
        width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 13px;
        border: 1px solid #ccc; border-radius: 6px; outline: none;
      }
      input[type="text"]:focus { border-color: #1a73e8; }
      fieldset { border: 0; padding: 0; margin: 12px 0 0; }
      label.opt { display: block; margin-bottom: 5px; cursor: pointer; }
      label.opt code {
        color: #666; font-size: 11px;
        display: block; margin-left: 20px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .row { display: flex; gap: 8px; margin-top: 14px; }
      button {
        flex: 1; padding: 7px 0; font-size: 13px; border-radius: 6px;
        border: 1px solid #ccc; background: #f5f5f5; color: #111; cursor: pointer;
      }
      button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
      .foot { margin-top: 12px; font-size: 11px; text-align: center; }
      a { color: #1a73e8; }
      .err { color: #c5221f; }
      [hidden] { display: none !important; }
      @media (prefers-color-scheme: dark) {
        body { background: #2b2b2b; color: #eee; }
        .lbl, .orig, label.opt code { color: #aaa; }
        input[type="text"] { background: #1f1f1f; color: #eee; border-color: #555; }
        button { background: #3a3a3a; border-color: #555; color: #eee; }
        button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
        a { color: #8ab4f8; }
      }
    </style>
  </head>
  <body>
    <div id="err" class="err" hidden>这个页面无法重命名（Chrome 内置页面不允许扩展注入脚本）。</div>

    <div id="main" hidden>
      <div class="lbl">原标题</div>
      <div class="orig" id="orig"></div>

      <div class="lbl">自定义名称</div>
      <input type="text" id="title" placeholder="留空则删除规则" />

      <fieldset>
        <div class="lbl">作用范围</div>
        <label class="opt">
          <input type="radio" name="mode" value="url" checked /> 仅此页面
          <code id="urlVal"></code>
        </label>
        <label class="opt">
          <input type="radio" name="mode" value="host" /> 整个网站
          <code id="hostVal"></code>
        </label>
      </fieldset>

      <div class="row">
        <button id="reset">恢复原标题</button>
        <button id="save" class="primary">保存</button>
      </div>
    </div>

    <div class="foot"><a href="#" id="opts">管理全部规则</a></div>
    <script src="popup.js"></script>
  </body>
</html>
