<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Tab Renamer 规则</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 760px; margin: 0 auto; padding: 28px 20px;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff; color: #111;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #666; font-size: 12px; margin-bottom: 20px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #e5e5e5; vertical-align: middle; }
      th { font-size: 12px; color: #666; font-weight: 500; }
      td.target { font-size: 12px; color: #666; word-break: break-all; }
      .tag {
        display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
        background: #eef2fb; color: #1a56c4; white-space: nowrap;
      }
      input[type="text"] {
        width: 100%; box-sizing: border-box; padding: 5px 8px; font-size: 13px;
        border: 1px solid transparent; border-radius: 5px; background: transparent;
        color: inherit; outline: none;
      }
      input[type="text"]:hover { border-color: #ddd; }
      input[type="text"]:focus { border-color: #1a73e8; background: #fff; }
      button.del {
        border: 0; background: transparent; color: #c5221f; cursor: pointer; font-size: 13px;
      }
      .empty { color: #666; padding: 32px 0; text-align: center; }
      .toolbar {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e5e5e5;
      }
      .toolbar .spacer { flex: 1; }
      .toolbar button {
        padding: 5px 12px; font-size: 13px; border-radius: 6px;
        border: 1px solid #ccc; background: #f5f5f5; color: #111; cursor: pointer;
      }
      .toolbar button.danger { color: #c5221f; }
      .count { font-size: 12px; color: #666; }
      .status { font-size: 12px; margin-bottom: 14px; }
      .status.ok { color: #188038; }
      .status.bad { color: #c5221f; }
      @media (prefers-color-scheme: dark) {
        body { background: #202124; color: #eee; }
        .sub, th, td.target { color: #aaa; }
        th, td { border-color: #3c4043; }
        .tag { background: #1f3a63; color: #8ab4f8; }
        input[type="text"]:hover { border-color: #555; }
        input[type="text"]:focus { border-color: #8ab4f8; background: #2b2b2b; }
        .empty { color: #aaa; }
        .toolbar { border-color: #3c4043; }
        .toolbar button { background: #3a3a3a; border-color: #555; color: #eee; }
        .toolbar button.danger { color: #f28b82; }
        .count { color: #aaa; }
        .status.ok { color: #81c995; }
        .status.bad { color: #f28b82; }
      }
    </style>
  </head>
  <body>
    <h1>标签重命名规则</h1>
    <div class="sub">标题可直接编辑，改完自动保存。同一页面若同时命中「页面」和「网站」规则，页面规则优先。</div>
    <div class="toolbar">
      <button id="export">导出</button>
      <button id="import">导入</button>
      <input type="file" id="file" accept="application/json,.json" hidden />
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <button id="clear" class="danger">清空全部</button>
    </div>

    <div class="status" id="status" hidden></div>
    <div id="list"></div>
    <script src="options.js"></script>
  </body>
</html>
