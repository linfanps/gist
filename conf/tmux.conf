unbind C-b
set -g prefix C-q
setw -g mode-keys vi
#up
bind-key k select-pane -U
#down
bind-key j select-pane -D
#left
bind-key h select-pane -L
#right
bind-key l select-pane -R

# mouse: wheel scrolls history (enters copy mode), click selects pane, drag resizes
set -g mouse on
# keep more scrollback
set -g history-limit 50000

# plugins (tpm): prefix + I to install, prefix + U to update
set -g @plugin 'tmux-plugins/tpm'
# resurrect: prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum: auto-save every 15 min, auto-restore when tmux server starts
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
